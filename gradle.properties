# AndroidX on tänapäeval AINUS tugiteekide perekond — vana android.support on
# lõpetatud. Ilma selle reata keeldub ehitus AndroidX-i sõltuvusi kasutamast.
android.useAndroidX=true

# Kotlini ametlik koodistiil (IDE vormindab selle järgi)
kotlin.code.style=official

# Gradle'i deemonile antav mälu. Vaikeväärtus jääb Compose'i projektil väikeseks.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Ehitab ainult need ressursid, mida moodul päriselt kasutab
android.nonTransitiveRClass=true
